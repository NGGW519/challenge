name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      AIC_SAMPLE_CONFIG: /tmp/aic_sample_config.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyyaml numpy

      - name: Fetch sample_config.yaml from aic toolkit
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/intrinsic-dev/aic/main/aic_engine/config/sample_config.yaml \
            -o "$AIC_SAMPLE_CONFIG"
          test -s "$AIC_SAMPLE_CONFIG"

      - name: Ruff lint
        run: ruff check aic_model_pkg/ scripts/ data/ training/ tests/

      - name: Pytest
        run: pytest tests/ -q

      - name: Pre-submit audit (non-strict)
        run: bash scripts/audit_pre_submit.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          scandir: ./scripts
