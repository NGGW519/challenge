# aic/docker/docker-compose.yaml 위에 덧붙여 사용:
#
#   docker compose \
#     -f aic/docker/docker-compose.yaml \
#     -f aic_work/docker/baseline-override.yaml \
#     up --abort-on-container-exit --exit-code-from eval
#
# 환경변수:
#   AIC_POLICY_MODULE  — 실행할 정책 (예: aic_example_policies.ros.CheatCode)
#   AIC_GROUND_TRUTH   — 'true' if CheatCode (학습/디버그용만)
#   AIC_RESULTS_DIR    — scoring.yaml 출력 위치 (호스트 디렉토리)

name: aic
services:
  eval:
    command: >
      gazebo_gui:=false
      launch_rviz:=false
      ground_truth:=${AIC_GROUND_TRUTH:-false}
      start_aic_engine:=true
      shutdown_on_aic_engine_exit:=true
      model_discovery_timeout_seconds:=600
    volumes:
      - ${AIC_RESULTS_DIR:-./aic_results}:/root/aic_results

  model:
    # 2026-05-12: dev image → aic_eval image 로 교체.
    # 토킷이 aic_eval image 안에 `/ws_aic/install` 로 aic_model 노드를 빌드해
    # 두므로 같은 image 로 model 도 띄우면 zenoh / lifecycle 환경이 정확히 일치.
    # (2026-05-11 host pixi env 로 띄웠을 때 lifecycle ACTIVATE 가 막힌 원인 회피.)
    image: ghcr.io/intrinsic-dev/aic/aic_eval
    entrypoint: ""
    command: >
      bash -lc "source /ws_aic/install/setup.bash &&
                export ZENOH_CONFIG_OVERRIDE='connect/endpoints=[\"tcp/eval:7447\"];transport/shared_memory/enabled=false' &&
                export ZENOH_SESSION_CONFIG_URI=/aic_zenoh_config.json5 &&
                exec ros2 run aic_model aic_model --ros-args
                  -p policy:=${AIC_POLICY_MODULE:-aic_example_policies.ros.WaveArm}
                  -p use_sim_time:=true"
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_ROUTER_CHECK_ATTEMPTS: -1
      AIC_ROUTER_ADDR: eval:7447
      AIC_POLICY_MODULE: ${AIC_POLICY_MODULE:-aic_example_policies.ros.WaveArm}
